# Upstream pages that arrive as English prose (ADR-0007). They ship in the default
# tree unchanged until a zh translation exists; the language audits exempt exactly
# these paths and still fail on any undeclared English page.
inherited_pages:
  - admin/deployment.md
  - admin/policy-reference.md
  - admin/security-questionnaire.md
  - admin/security-whitepaper.md
  - batch.md
  - code-signing.md
  - design/model-audit.md
  - install.md
  - mcp-specifications.md
  - not-doing.md
  - prompts.md
  - stability.md
  - tested-clients.md
  - tool-manifest.md
  - updates.md

# Declarative catalog manifest for the documentation site.
#
# Two catalogs are published side by side and must never be confused:
#   release      the released tool surface under docs/features, built from tools.json.
#   integration  the tool surface of the development line under docs/platform, built from
#                platform-tools.json. It is unreleased: its pages track a line that no
#                release carries yet.
#
# The generators and the site checker read this file instead of hard-coding a version string,
# a branch name, a tool count or a tool name. The release version is read from project
# metadata, so it moves with the package instead of being copied here.
#
# page_languages overrides the catalog default for one page stem when a page is intentionally
# monolingual (for example an inherited page kept in English only). A page that promises a
# language it does not ship makes generation and validation fail.
release:
  directory: features
  status: released
  branch: main
  languages: [zh, en]
  page_languages: {}
  version:
    file: server/pyproject.toml
    format: toml
    pointer: project.version
  # The last version that was actually published. A tool whose `since` is at or
  # below this ships in a release; a newer one exists only in the tree, so its
  # page says unreleased instead of claiming a release that has not happened.
  released_version: 1.0.0

integration:
  directory: platform
  status: unreleased
  branch: feat/gitlab-pages
  languages: [zh, en]
  page_languages: {}
  provenance:
    file: tools/site/content/platform-tools.json

# Fork-owned tools: the ones this repository designed, not the upstream base. A tool is
# grafted when the snapshot registry carries it and pending when it does not, so the
# status and the snapshot cannot drift apart (test_catalogs.py holds them together).
fork_tools:
  revit_set_view_lighting:
    status: grafted
    zh: 设置视图光照
    en: Set view lighting
    zh_note: '在两条线上都在：fork 注册表接上兜底钩子，Python 工具、C# 编译与真机验证齐备。'
    en_note: 'Present on both lines: attached through the fork registry, with the Python tool, the C# build and live validation all in hand.'
  revit_create_level:
    status: grafted
    zh: 创建标高
    en: Create level
    zh_note: '按新契约重映射到 fork 注册表；可同时建同名楼层平面视图，重名即拒绝并给出既有标高的名称与高程。'
    en_note: 'Remapped onto the fork registry; it can create the matching floor plan view, and a duplicate name is refused with the existing level names and elevations.'
  revit_create_floor:
    status: grafted
    zh: 创建楼板
    en: Create floor
    zh_note: '按新契约重映射到 fork 注册表，带 dry_run 与验证块。'
    en_note: 'Remapped onto the fork registry with dry_run and a verification block.'
  revit_load_family_file:
    status: grafted
    zh: 载入族文件
    en: Load family file
    zh_note: '单文件、可选定点类型、总是带族载入选项、路径不存在报最近匹配。'
    en_note: 'One file, an optional single type, the load options always supplied, and the closest names for a missing path.'
  revit_create_grid:
    status: grafted
    zh: 创建轴网
    en: Create grid
    zh_note: '直线与三点定弧、重名拒绝、带批量步骤词表。'
    en_note: 'Line and three-point arc, duplicate-name refusal, and the batch step vocabulary.'
  revit_create_column:
    status: grafted
    zh: 创建柱
    en: Create column
    zh_note: '顶底标高与偏移由工具写、柱顶给标高或高度、不做附着、类型不存在列出可用类型。'
    en_note: 'The tool writes both levels and both offsets, the top is a level or a height, nothing is attached, and a missing type lists the ones that exist.'
  revit_create_beam:
    status: grafted
    zh: 创建梁
    en: Create beam
    zh_note: '走曲线加标高的重载、端点不吸附、结构用途按枚举写入、竖向偏移先写族的标高参数再退到移动实例。'
    en_note: 'The curve-and-level overload, an axis that is never snapped, structural usage written from the enum, and the vertical offset through the family''s elevation parameter with a move as the fallback.'
  revit_place_hosted_family:
    status: grafted
    zh: 放置宿主族
    en: Place hosted family
    zh_note: '点名宿主或就近找墙、并列与超半径被拒并列出候选、回报 hostResolution、支持窗台与翻转、非零角度与非单层宿主族被拒。'
    en_note: 'A named host or the nearest wall, ties and out-of-radius points refused with the candidates, hostResolution reported, sill and flip supported, a non-zero angle and non-hosted families refused.'
  revit_copy_elements:
    status: grafted
    zh: 跨标高复制构件
    en: Copy elements across levels
    zh_note: '只走会重宿主的重载、总是设重名类型处理器、宿主必须在同一批里、按类别类型与位置逐个配对并给出 idMappingVerified。'
    en_note: 'Only the overload that re-hosts, the duplicate-type handler always set, hosts required in the same batch, and an element-by-element pairing with idMappingVerified.'
  revit_set_phase:
    status: grafted
    zh: 设置阶段
    en: Set phase
    zh_note: 'Revit 阶段不能创建或改名，只能写入既有阶段。'
    en_note: 'Revit cannot create or rename phases, so it only assigns existing ones.'
  revit_merge_phases:
    status: grafted
    zh: 合并阶段
    en: Merge phases
    zh_note: '该命令不进批量步骤词表。'
    en_note: 'The command is excluded from the batch step vocabulary.'
  revit_export_element_ids:
    status: grafted
    zh: 导出构件 ID 台账
    en: Export element ID register
    zh_note: '输出 xlsx 台账，含系统成员与连接器读取。'
    en_note: 'Writes an xlsx register and reads system members and connectors.'
  revit_reset_element_ids:
    status: grafted
    zh: 重置构件 ID
    en: Reset element IDs
    zh_note: '可排练，dry_run 报出代价，每构件独立子事务。'
    en_note: 'Rehearsable, reports the cost in dry_run, and commits each element in its own subtransaction.'
  revit_rebuild_model_ids:
    status: grafted
    zh: 重建模型 ID
    en: Rebuild model IDs
    zh_note: '支持模板、副本与重名策略；约一千行，是这十四项里最后落地的一项。'
    en_note: 'Supports templates, copies and duplicate-name policies; about a thousand lines, and the last of the fourteen to land.'
