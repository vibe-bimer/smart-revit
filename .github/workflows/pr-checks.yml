name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  quality-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check workflows with actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: pip install --require-hashes -r docs/requirements.txt
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install the server for the registry check
        working-directory: server
        run: uv sync --frozen --no-dev
      - name: Build documentation
        run: |
          python tools/site/generate_features.py --verify-registry --check
          python -m unittest discover -s tools/site -p 'test_*.py'
          mkdocs build --strict
          python tools/site/check_site.py --site-dir site

  dotnet-format:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages*.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore solution with locks
        env:
          Configuration: Debug.R26
          DeployAddin: 'false'
        run: dotnet restore RevitModelMcp.sln --locked-mode
      - name: Verify C# formatting
        env:
          Configuration: Debug.R26
          DeployAddin: 'false'
        run: dotnet format RevitModelMcp.sln --no-restore --verify-no-changes --verbosity minimal

  # Branch protection requires pr-checks.
  quality:
    name: pr-checks
    needs: [quality-linux, dotnet-format]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
