# Upstream ships on Mondays (Europe/Moscow) and gates its release pull request with
# a calendar check. This fork has no release schedule: the maintainer decides when a
# tag is ready, so the check reports the cadence and never blocks a merge.
name: Release window

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-window:
    if: github.event_name == 'pull_request'
    name: release-window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Report the release cadence
        run: |
          if [ "$HEAD_REF" != "release-please--branches--main" ] || [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "Not the release pull request, nothing to report."
            exit 0
          fi
          weekday="$(TZ=Europe/Moscow date +%u)"
          if [ "$weekday" = "1" ]; then
            echo "It is Monday in Europe/Moscow, upstream's release window."
            exit 0
          fi
          echo "::warning::Upstream ships on Mondays (Europe/Moscow). This fork has no release schedule, so this pull request is not blocked."
