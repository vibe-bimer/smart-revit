version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/RevitModelMcp.Addin
      - /src/RevitModelMcp.Core
      - /tests/RevitModelMcp.Core.Tests
      - /build
      - /build/install
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    labels: [dependencies, build]
    ignore:
      # TUnit 1.83.0 loads Microsoft.Bcl.AsyncInterfaces 9.0.0 at run time, and the locked
      # graph carries no entry for it, so the test host aborts before a single test runs.
      - dependency-name: TUnit
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: pip
    # The server's dependency set is hash-pinned in server/requirements.docker.txt and derived
    # from server/uv.lock. The two have to move in one commit, which the pip ecosystem cannot
    # do, so /server stays out of it and a maintainer refreshes the pair with one command.
    directories:
      - /docs
      - /.github/requirements
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    # pydantic pins one exact pydantic-core build. Both stay in the "all" group, so a single
    # pull request moves them together; ignoring pydantic-core instead leaves the pair out of
    # step and the packaged exe fails to start.
    labels: [dependencies, server]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, build]
    commit-message:
      prefix: chore(deps)
